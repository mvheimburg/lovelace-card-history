name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_call:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # The library in dist/ is what cards install from a tag: it must match the source.
      - run: git diff --exit-code -- dist
      - uses: actions/upload-artifact@v4
        with: {name: lovelace-card-history, path: dist/lovelace-card-history.js}
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with: {category: plugin}
